<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generate Recipe</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container mt-5">
      <h1 class="text-center mb-4">Generate a Recipe</h1>
      <form method="POST" class="card p-4 shadow-sm">
        <div class="mb-3">
          <label for="ingredients" class="form-label">Enter Ingredients:</label>
          <textarea
            id="ingredients"
            name="ingredients"
            class="form-control"
            rows="5"
            placeholder="Enter ingredients separated by commas"
          ></textarea>
        </div>
        <div class="text-center">
          <button type="submit" class="btn btn-success btn-lg">Generate</button>
        </div>
      </form>

      {% if recipe %}
      <div class="card mt-5 p-4 shadow-sm">
        <h2 class="text-center text-success">Generated Recipe</h2>
        <p>{{ recipe }}</p>
      </div>
      {% elif error %}
      <div class="alert alert-danger mt-5" role="alert">{{ error }}</div>
      {% endif %}
    </div>
  </body>
</html>
